version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: brandex-postgres
    environment:
      POSTGRES_USER: brandex
      POSTGRES_PASSWORD: brandex_password
      POSTGRES_DB: brandex_utilities
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandex -d brandex_utilities"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: brandex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: brandex-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minio_admin_password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    container_name: brandex-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add brandex http://minio:9000 admin minio_admin_password;
      /usr/bin/mc mb brandex/inputs --ignore-existing;
      /usr/bin/mc mb brandex/working --ignore-existing;
      /usr/bin/mc mb brandex/outputs --ignore-existing;
      /usr/bin/mc anonymous set download brandex/outputs;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
